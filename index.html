 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gopedia</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#f1f3f4;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
  margin-top:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  text-decoration:none;
  color:#202124;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.card h3{
  margin:0 0 8px;
}

.card p{
  margin:0;
  color:#5f6368;
}

</style>
</head>
<body>

<h1>Gopedia</h1>

<div id="articles" class="grid"></div>

<script>

fetch("articles.json")
.then(response => response.json())
.then(data => {

  const container =
    document.getElementById("articles");

  data.forEach(article => {

    const card =
      document.createElement("a");

    card.className = "card";
    card.href = article.url;

    card.innerHTML = `
      <h3>${article.title}</h3>
      <p>${article.description}</p>
    `;

    container.appendChild(card);

  });

});

</script>

</body>
</html>
